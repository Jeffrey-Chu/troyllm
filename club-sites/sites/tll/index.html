function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });
}
function useInView(ref) {
  const [v, setV] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); io.disconnect(); } }, { threshold: .3 });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  return v;
}
function upcomingMeetings(n = 4) {
  const start = new Date(CONFIG.meeting.firstUpcoming + 'T12:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  let d = new Date(start);
  while (d < today) d.setDate(d.getDate() + 14);
  const out = [];
  for (let i = 0; i < n; i++) { out.push(new Date(d)); d.setDate(d.getDate() + 14); }
  return out;
}

/* ============================ PATH QUIZ ============================ */
const QUIZ = [
  { k:'role', q:'What brings you to Learning League?', opts:['I want help (tutee)','I want to tutor','I want to join the board','Just exploring'] },
  { k:'grade', q:'What grade are you in?', opts:['Elementary (K–5)','Middle (6–8)','9th–10th','11th–12th'] },
  { k:'goal', q:'What’s your main goal?', opts:['Raise a class grade','Prep for AP / SAT / exams','Competitions','Earn volunteer hours'] },
  { k:'challenge', q:'What’s your biggest challenge?', opts:['Understanding the material','Staying organized','Test anxiety / timing','Finding time'] },
];
function buildRoadmap(a) {
  const steps = [];
  let form = CONFIG.links.tuteeForm, formLabel = 'Tutee Request', headline = 'Your Learning League roadmap';
  if (a.role === 'I want to tutor') {
    form = CONFIG.links.tutorForm; formLabel = 'Tutor Application'; headline = 'Your tutor roadmap';
    steps.push('Submit the Tutor Application with the subjects you’re strongest in.');
    steps.push(a.grade === '11th–12th' ? 'Upperclassmen are great for AP and test-prep matches — list the APs you’ve passed.' : 'Consider tutoring middle or elementary students — great matches for newer tutors.');
    steps.push('Use the Volunteer Hours calculator below to plan your semester goal.');
  } else if (a.role === 'I want to join the board') {
    form = CONFIG.links.boardForm; formLabel = 'Board Application'; headline = 'Your board roadmap';
    steps.push('Check the open roles in the Team section and pick one that fits you.');
    steps.push(`Come to a meeting (${CONFIG.meeting.when}, ${CONFIG.meeting.where}) to meet the board.`);
    steps.push('Submit the Board Application, or DM us on Instagram to ask questions.');
  } else {
    steps.push(`Submit the Tutee Request — note you’re in ${a.grade}.`);
    const g = { 'Raise a class grade':'Bring recent tests or homework so your tutor can see where to focus.', 'Prep for AP / SAT / exams':'Ask for a test-prep tutor and watch for our Test-Taking Tips workshop.', 'Competitions':'Mention the competition name so we match you with someone who’s done it.', 'Earn volunteer hours':'Since you want hours, consider applying as a tutor too!' }[a.goal];
    steps.push(g);
    const c = { 'Understanding the material':'Ask for 1-on-1 sessions so you can go at your own pace.', 'Staying organized':'Ask your tutor to help you build a weekly study plan.', 'Test anxiety / timing':'Practice timed questions with your tutor and attend our study sessions.', 'Finding time':'Meetings happen at lunch — no after-school time needed.' }[a.challenge];
    steps.push(c);
  }
  if (a.role === 'Just exploring') steps.unshift('Follow @troy.learning.league on Instagram for events and updates.');
  return { headline, steps, form, formLabel };
}
function PathQuiz() {
  const [step, setStep] = useState(0);
  const [ans, setAns] = useState({});
  const done = step >= QUIZ.length;
  const pick = (k, v) => { setAns({ ...ans, [k]: v }); setStep(step + 1); };
  const r = done ? buildRoadmap(ans) : null;
  return (
    <section id="quiz" className="py-24 bg-deep relative overflow-hidden">
      <div className="absolute inset-0 grain opacity-50" />

          {!done ? (

              <h3 className="font-display font-bold text-2xl sm:text-3xl text-white mt-2">{QUIZ[step].q}</h3>
              <div className="grid sm:grid-cols-2 gap-3 mt-6">

              </div>
              {step > 0 && <button onClick={() => setStep(step-1)} className="mt-6 text-sky/80 text-sm flex items-center gap-1 hover:text-white"><Icon n="back" className="w-4 h-4" />Back</button>}
            </div>
          ) : (
            <div className="pop">
              <div className="flex items-center gap-3"><div className="w-12 h-12 rounded-2xl bg-sun text-ink grid place-items-center"><Icon n="target" /></div><h3 className="font-display font-bold text-2xl sm:text-3xl text-white">{r.headline}</h3></div>
              <ol className="mt-6 space-y-3">
                {r.steps.map((s,i) => (
                  <li key={i} className="flex gap-4 rounded-2xl bg-white/5 border border-white/10 p-4 pop" style={{ animationDelay: `${i*120}ms` }}>
                    <span className="shrink-0 w-8 h-8 rounded-full bg-brand text-white font-bold grid place-items-center text-sm">{i+1}</span>
                    <p className="text-sky/95 pt-1">{s}</p>
                  </li>
                ))}
              </ol>
              <div className="mt-8 flex flex-wrap gap-3">
                <FormLink href={r.form} variant="sun">{r.formLabel} <Icon n="ext" className="w-4 h-4" /></FormLink>
                <button onClick={() => { setStep(0); setAns({}); }} className="rounded-xl px-5 py-3 font-semibold text-white border border-white/25 hover:bg-white/10">Start over</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

/* ============================ HOURS CALCULATOR ============================ */
function HoursCalc() {
  const [mode, setMode] = useState('1on1');

  const [months, setMonths] = useState(5);
  const eventBonus = mode === 'group' ? 1.5 : 0; // group/event sessions often include setup time
  const perMonth = sessions * (len/60) + eventBonus;
  const total = Math.round(perMonth * months * 10) / 10;
  const goals = [25, 50, 100];
  const included = mode === '1on1'
    ? ['Matched with a tutee by subject','Lunch-time or scheduled sessions','Hours verified by the board']
    : ['Help run study sessions & workshops','Community events (e.g., library sessions)','Includes setup & event time'];
  return (
    <section id="hours" className="py-24 bg-mist">
      <div className="mx-auto max-w-6xl px-4">
        <SectionHead eyebrow="For tutors" title="Volunteer hours calculator" sub="Estimate how many service hours you can earn this school year. Final hours are verified by the board." />
        <div className="reveal grid lg:grid-cols-5 gap-6">
          <div className="lg:col-span-3 rounded-xl bg-white border border-slate-200 p-6 sm:p-8 shadow-sm">
            <div className="flex p-1 bg-slate-100 rounded-2xl">
              {[['1on1','1-on-1 Tutoring'],['group','Group Sessions & Events']].map(([k,l]) => (
                <button key={k} onClick={() => setMode(k)} className={`flex-1 py-3 rounded-xl text-sm font-semibold transition-all ${mode===k ? 'bg-deep text-white shadow-lg' : 'text-slate-500 hover:text-deep'}`}>{l}</button>
              ))}
            </div>
            <div className="mt-8 space-y-8">
              <div>
                <div className="flex justify-between font-semibold"><label htmlFor="s">Sessions per month</label><span className="text-brand">{sessions}</span></div>
                <input id="s" type="range" min="1" max="16" value={sessions} onChange={e => setSessions(+e.target.value)} className="w-full mt-3" />
              </div>
              <div>
                <p className="font-semibold">Session length</p>
                <div className="grid grid-cols-4 gap-2 mt-3">
                  {[30,45,60,90].map(m => <button key={m} onClick={() => setLen(m)} className={`py-2.5 rounded-xl border-2 font-semibold text-sm transition ${len===m ? 'border-brand bg-brand/10 text-deep' : 'border-slate-200 text-slate-500 hover:border-brand'}`}>{m} min</button>)}
                </div>
              </div>
              <div>
                <div className="flex justify-between font-semibold"><label htmlFor="m">Months active</label><span className="text-brand">{months}</span></div>
                <input id="m" type="range" min="1" max="9" value={months} onChange={e => setMonths(+e.target.value)} className="w-full mt-3" />
              </div>
            </div>
          </div>
          <div className="lg:col-span-2 rounded-xl bg-deep text-white p-6 sm:p-8 shadow-xl flex flex-col">
            <p className="text-sky/70 text-sm font-semibold uppercase tracking-wider">Estimated total</p>
            <p className="font-display text-6xl mt-2">{total}<span className="text-2xl text-sky/70 ml-2">hrs</span></p>
            <p className="text-sky/70 text-sm mt-1">≈ {Math.round(perMonth*10)/10} hrs / month</p>
            <div className="mt-6 space-y-4">
              {goals.map(g => {
                const pct = Math.min(100, total/g*100);
                return (
                  <div key={g}>
                    <div className="flex justify-between text-sm mb-1.5"><span className="flex items-center gap-1.5">{pct >= 100 && <Icon n="check" className="w-4 h-4 text-sun" />}{g}-hour milestone</span><span className="text-sky/70">{Math.round(pct)}%</span></div>
                    <div className="h-2.5 rounded-full bg-white/10 overflow-hidden"><div className={`h-full rounded-full transition-all duration-700 ${pct>=100 ? 'bg-sun' : 'bg-brand'}`} style={{ width: `${pct}%` }} /></div>
                  </div>
                );
              })}
            </div>
            <ul className="mt-6 space-y-2 text-sm text-sky/90">{included.map(i => <li key={i} className="flex gap-2"><Icon n="check" className="w-4 h-4 text-sun shrink-0 mt-0.5" />{i}</li>)}</ul>
            <FormLink href={CONFIG.links.tutorForm} variant="sun" className="mt-auto pt-3 w-full !mt-6">Start earning hours</FormLink>
          </div>
        </div>
      </div>
    </section>
  );
}

function Counter({ to, suffix='' }) {
  const ref = useRef(null); const v = useInView(ref); const [n, setN] = useState(0);
  useEffect(() => { if (!v) return; let i = 0; const steps = 40; const t = setInterval(() => { i++; setN(Math.round(to * i/steps)); if (i >= steps) clearInterval(t); }, 25); return () => clearInterval(t); }, [v]);
  return <span ref={ref}>{n}{suffix}</span>;
}
function Events() {
  const [tab, setTab] = useState(EVENTS[0].key);
  const e = EVENTS.find(x => x.key === tab);
  const ref = useRef(null); const v = useInView(ref);
  return (
    <section id="events" className="py-24 bg-paper">
      <div className="mx-auto max-w-6xl px-4">
        <SectionHead eyebrow="Events & impact" title="Past events" sub="Workshops, partnerships, and community tutoring — beyond the classroom." />
        <div className="reveal grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
          {[[202,'','Instagram followers'],[21,'','Instagram posts'],[2,'','Community partners'],[1,'×/wk','Lunch sessions']].map(([n,s,l]) => (
            <div key={l} className="rounded-2xl bg-white border border-slate-200 p-5 text-center hover:border-brand transition">
              <p className="font-display text-4xl text-deep"><Counter to={n} suffix={s} /></p>
              <p className="text-sm text-slate-500 mt-1">{l}</p>
            </div>
          ))}
        </div>
        <div className="reveal flex gap-2 overflow-x-auto pb-2 mb-6">
          {EVENTS.map(x => <button key={x.key} onClick={() => setTab(x.key)} className={`shrink-0 px-5 py-2.5 rounded-full font-semibold text-sm transition ${tab===x.key ? 'bg-deep text-white shadow-lg' : 'bg-sky/60 text-deep hover:bg-sky'}`}>{x.tab}</button>)}
        </div>
        <div ref={ref} key={tab} className="pop grid md:grid-cols-5 gap-6 rounded-xl bg-white border border-slate-200 p-6 sm:p-10 shadow-sm">
          <div className="md:col-span-3">
            {e.img && <a href={IG + e.post + '/'} target="_blank" rel="noopener noreferrer" className="float-right ml-5 mb-3 w-36 sm:w-44 block border-2 border-deep rotate-2 shadow-[4px_4px_0_#0F4C6E] hover:rotate-0 transition"><img src={e.img} alt={e.title + ' poster'} className="w-full block" /></a>}
            <span className="text-xs font-semibold uppercase tracking-wider text-brand">{e.partner}</span>
            <h3 className="font-display text-3xl text-ink mt-2">{e.title}</h3>
            <p className="flex items-center gap-2 text-slate-500 mt-2"><Icon n="calendar" className="w-4 h-4" />{e.date}</p>
            <p className="text-slate-600 mt-4 text-lg">{e.desc}</p>
          </div>
          <div className="md:col-span-2 rounded-2xl bg-mist border border-sky p-6">
            <p className="font-semibold text-deep mb-4">Highlights</p>
            <ul className="space-y-3">
              {e.highlights.map((h,i) => (
                <li key={h} className="transition-all duration-500" style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateX(12px)', transitionDelay: `${i*120}ms` }}>
                  <div className="flex items-center gap-2 text-slate-700"><Icon n="check" className="w-4 h-4 text-brand" />{h}</div>
                  <div className="h-1 mt-2 rounded-full bg-white overflow-hidden"><div className="h-full bg-brand transition-all duration-1000" style={{ width: v ? '100%' : '0%', transitionDelay: `${i*150}ms` }} /></div>
                </li>
              ))}
            </ul>
            <a href={CONFIG.links.instagram} target="_blank" rel="noopener noreferrer" className="mt-6 inline-flex items-center gap-2 text-sm font-semibold text-brand hover:gap-3 transition-all"><Icon n="insta" className="w-4 h-4" />See posts on Instagram</a>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================ INSTAGRAM GALLERY ============================ */
function Gallery() {
  return (
    <section id="posts" className="py-24 bg-sky">
      <div className="mx-auto max-w-6xl px-4">
        <SectionHead eyebrow="@troy.learning.league" title="From our Instagram" sub="Recent posts. Tap one to open it on Instagram." />
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          {POSTS.map(([id,label],i) => (
            <a key={id} href={IG + id + '/'} target="_blank" rel="noopener noreferrer" className="reveal group block bg-white border-2 border-deep shadow-[4px_4px_0_#0F4C6E] hover:-translate-y-1 hover:shadow-[6px_6px_0_#0F4C6E] transition" style={{ transitionDelay: `${(i%4)*50}ms` }}>
              <img src={`img/${id}.webp`} alt={label + ' poster'} loading="lazy" className="w-full aspect-[4/5] object-cover block" />
              <p className="px-3 py-2 text-sm font-bold text-deep border-t-2 border-deep">{label}</p>
            </a>
          ))}
        </div>
        <div className="text-center mt-10">
          <a href={CONFIG.links.instagram} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-deep text-white font-bold px-5 py-3 rounded-lg hover:bg-ink transition"><Icon n="insta" className="w-5 h-5" />Follow @troy.learning.league</a>
        </div>
      </div>
    </section>
  );
}

/* ============================ TEAM ============================ */
function Team() {
  return (
    <section id="team" className="py-24 bg-mist">
      <div className="mx-auto max-w-6xl px-4">
        <SectionHead eyebrow="Meet the board" title="Meet the board" />
        <div className="grid sm:grid-cols-3 gap-5">
          {CONFIG.board.map((b,i) => (
            <div key={b.name} className="reveal group rounded-xl bg-white border border-slate-200 p-7 text-center hover:border-deep transition-all" style={{ transitionDelay: `${i*80}ms` }}>
              <div className="mx-auto w-24 h-24 rounded-full bg-sky p-1"><div className="w-full h-full rounded-full bg-white grid place-items-center font-display text-2xl text-deep">{initials(b.name)}</div></div>
              <h3 className="font-display font-bold text-xl mt-4">{b.name}</h3>
              <p className="text-brand font-semibold text-sm">{b.role}</p>
              <p className="text-slate-500 text-sm mt-3">{b.blurb}</p>
            </div>
          ))}
        </div>
        <div className="reveal mt-8 rounded-xl border-2 border-dashed border-brand/50 bg-white/60 p-8">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
              <h3 className="font-display font-bold text-2xl text-deep">We’re recruiting board members!</h3>
              <p className="text-slate-600 mt-1">Help lead tutoring, events, and outreach this year.</p>
              <div className="flex flex-wrap gap-2 mt-4">{CONFIG.openRoles.map(r => <span key={r} className="text-sm font-semibold bg-sun/70 text-ink px-3 py-1 rounded-full">{r}</span>)}</div>
            </div>
            <FormLink href={CONFIG.links.boardForm} variant="outline">Apply for the board</FormLink>
          </div>
        </div>
      </div>
    </section>

}

/* ============================ FORMS HUB ============================ */
function Forms() {
  const all = [
    { t:'Tutor Application', d:'Sign up to tutor and list your subjects.', who:'Tutors', href:CONFIG.links.tutorForm },
    { t:'Tutee Request', d:'Request a tutor for a class, exam, or competition.', who:'Tutees', href:CONFIG.links.tuteeForm },
    { t:'Volunteer Hours Log', d:'Log your hours after every lesson so they can be signed off each semester. Also in Google Classroom.', who:'Tutors', href:CONFIG.links.hoursForm },
    { t:'Board Application', d:'Apply for an open board position.', who:'Everyone', href:CONFIG.links.boardForm },
  ];
  const [f, setF] = useState('All');
  const shown = all.filter(x => f === 'All' || x.who === f);
  return (
    <section id="forms" className="py-24 bg-paper">
      <div className="mx-auto max-w-5xl px-4">
        <SectionHead eyebrow="Forms & resources" title="Forms" sub="No more digging through Google Classroom." />
        <div className="reveal flex justify-center gap-2 mb-6">{['All','Tutors','Tutees','Everyone'].map(x => <button key={x} onClick={() => setF(x)} className={`px-4 py-2 rounded-full text-sm font-semibold transition ${f===x ? 'bg-deep text-white' : 'bg-sky/60 text-deep hover:bg-sky'}`}>{x}</button>)}</div>
        <div className="grid sm:grid-cols-2 gap-4">
          {shown.map(x => (
            <div key={x.t} className="pop flex items-start gap-4 rounded-2xl bg-white border border-slate-200 p-5 hover:border-brand hover:shadow-lg transition">
              <div className="w-12 h-12 shrink-0 rounded-xl bg-sky text-deep grid place-items-center"><Icon n="file" /></div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap"><h3 className="font-semibold text-ink">{x.t}</h3><span className="text-[11px] font-semibold bg-mist text-brand px-2 py-0.5 rounded-full border border-sky">{x.who}</span></div>
                <p className="text-sm text-slate-500 mt-1">{x.d}</p>
                {x.href
                  ? <a href={x.href} target="_blank" rel="noopener noreferrer" className="mt-3 inline-flex items-center gap-1 text-sm font-semibold text-brand hover:gap-2 transition-all">Open form <Icon n="ext" className="w-4 h-4" /></a>
                  : <span className="mt-3 inline-block text-sm text-slate-400">Coming soon</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============================ FAQ ============================ */
function FAQ() {
  const [open, setOpen] = useState(0);
  return (
    <section id="faq" className="py-24 bg-mist">
      <div className="mx-auto max-w-3xl px-4">
        <SectionHead eyebrow="FAQ" title="Frequently asked questions" />
        <div className="space-y-3">
          {FAQS.map((f,i) => {
            const on = open === i;
            return (
              <div key={i} className={`reveal rounded-2xl border transition-all ${on ? 'bg-white border-brand shadow-lg' : 'bg-white/70 border-slate-200'}`}>
                <button onClick={() => setOpen(on ? -1 : i)} className="w-full flex items-center justify-between gap-4 text-left px-6 py-5" aria-expanded={on}>
                  <span className="font-semibold text-ink">{f.q}</span>
                  <span className={`shrink-0 w-8 h-8 rounded-full grid place-items-center transition ${on ? 'bg-deep text-white rotate-180' : 'bg-sky text-deep'}`}><Icon n="chevron" className="w-4 h-4" /></span>
                </button>
                <div className="grid transition-all duration-300" style={{ gridTemplateRows: on ? '1fr' : '0fr' }}>
                  <div className="overflow-hidden"><p className="px-6 pb-5 text-slate-600">{f.a}</p></div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

/* ============================ FOOTER ============================ */
function Footer() {
  const [email, setEmail] = useState('');
  const [state, setState] = useState('idle');
  const [msg, setMsg] = useState('');
  useEffect(() => TLL.onUser(({ user }) => setEmail(user ? user.email : '')), []);
  const submit = async e => {
    e.preventDefault();
    setState('busy');
    try { const r = await TLL.subscribe(); setEmail(r.email); setState(r.already ? 'already' : 'ok'); }
    catch (err) { setMsg(TLL.friendlyError(err)); setState('error'); }
  };
  return (
    <footer className="bg-ink text-sky/80 pt-20 pb-10 relative overflow-hidden">
      <div className="absolute inset-0 grain opacity-40" />
      <div className="relative mx-auto max-w-7xl px-4">
        <div className="rounded-xl bg-sun border-2 border-deep p-8 sm:p-10 flex flex-col lg:flex-row gap-6 lg:items-center justify-between mb-16 shadow-2xl">
          <div><h3 className="font-display text-3xl text-deep">Join Learning League</h3><p className="text-ink/80 mt-1">Tutoring is free. Sign-ups take about 5 minutes.</p></div>
          <div className="flex flex-wrap gap-3"><FormLink href={CONFIG.links.tutorForm} className="!bg-deep hover:!bg-ink">Become a Tutor</FormLink><FormLink href={CONFIG.links.tuteeForm} variant="outline" className="bg-white">Get a Tutor</FormLink></div>
        </div>
        <div className="grid md:grid-cols-4 gap-10">
          <div className="md:col-span-2">
            <div className="flex items-center gap-3"><Logo size={48} /><span className="font-logo text-2xl text-white tracking-wide">LEARNING LEAGUE</span></div>
            <p className="mt-4 max-w-sm">Connecting Troy students with tutors and tutees. Earn service hours. Grow together.</p>
            <form onSubmit={submit} className="mt-6 max-w-md" noValidate>
              <label className="text-sm font-semibold text-white" htmlFor="nl">Get event & meeting updates</label>
              <div className="flex gap-2 mt-2">
                <div className="relative flex-1 flex items-center pl-9 pr-3 py-3 rounded-xl bg-white/10 border border-white/15 text-white text-sm"><Icon n="mail" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />{email || 'Uses your Google email'}</div>
                <button disabled={state==='busy'} className="rounded-xl bg-sun text-ink font-semibold px-5 hover:bg-sunDeep transition disabled:opacity-60">{email ? 'Subscribe' : 'Subscribe with Google'}</button>
              </div>
              {state==='error' && <p className="text-red-300 text-sm mt-2">{msg}</p>}
              {state==='already' && <p className="text-emerald-300 text-sm mt-2">You’re already on the list.</p>}
              {state==='ok' && <p className="text-emerald-300 text-sm mt-2 flex items-center gap-1"><Icon n="check" className="w-4 h-4" />Thanks! {email} is on the list.</p>}
            </form>
          </div>
          <div>
            <p className="font-semibold text-white mb-3">Explore</p>
            <ul className="space-y-2 text-sm">{[['Mission','mission'],['Find a Tutor','tutors'],['Path Quiz','quiz'],['Hours Calculator','hours'],['Events','events'],['Posts','posts'],['Team','team'],['FAQ','faq']].map(([l,id]) => <li key={id}><button onClick={() => go(id)} className="hover:text-white">{l}</button></li>)}</ul>
          </div>
          <div>
            <p className="font-semibold text-white mb-3">Visit us</p>
            <ul className="space-y-3 text-sm">
              <li className="flex gap-2"><Icon n="calendar" className="w-4 h-4 mt-0.5" />{CONFIG.meeting.when}</li>
              <li className="flex gap-2"><Icon n="pin" className="w-4 h-4 mt-0.5" />{CONFIG.meeting.where}, Troy High School</li>
              <li className="flex gap-2"><Icon n="users" className="w-4 h-4 mt-0.5" />{CONFIG.meeting.walkin}</li>
              <li><a href={CONFIG.links.instagram} target="_blank" rel="noopener noreferrer" className="flex gap-2 hover:text-white"><Icon n="insta" className="w-4 h-4 mt-0.5" />@troy.learning.league</a></li>
            </ul>
            <div className="flex flex-wrap gap-2 mt-5">{['Student-run','Free tutoring','Service hours'].map(b => <span key={b} className="text-[11px] font-semibold border border-white/20 rounded-full px-2.5 py-1 flex items-center gap-1"><Icon n="check" className="w-3 h-3 text-sun" />{b}</span>)}</div>
          </div>
        </div>
        <div className="border-t border-white/10 mt-14 pt-6 flex flex-col sm:flex-row justify-between gap-2 text-xs text-sky/60">
          <p>© {new Date().getFullYear()} Troy Learning League. Student-run club.</p>
          <p>Troy High School</p>
        </div>
      </div>
    </footer>
  );
}

/* ============================ APP ============================ */
function App() {
  const [subject, setSubject] = useState('All');
  useReveal();
  return (
    <>
      <Navbar onPickSubject={setSubject} />
      <main>
        <Hero />
        <Marquee />
        <Mission />
        <Join />
        <TutorFinder subject={subject} setSubject={setSubject} />
        <PathQuiz />
        <HoursCalc />
        <Events />
        <Gallery />
        <Team />
        <Forms />
        <FAQ />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
