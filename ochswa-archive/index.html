<title>OCHSWA Championship Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style id="css">
/* Layout: one dark library wall, one walnut shelf per decade holding a leather-bound book per season; a book opens into a full-screen flipbook. Single dark look by design. */
:root{
  color-scheme:dark;
  --wall:#121417; --wall-2:#1a1d22; --ivory:#efe8d8; --muted:#a59c8a; --line:#2c2f35;
  --brass:#c9a45c; --brass-hi:#e6c983; --wood:#4a3322; --wood-dk:#24170e; --paper:#f7f3ea;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 80% at 50% 0%,var(--wall-2),var(--wall) 70%) fixed,var(--wall);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{display:flex;align-items:end;gap:16px;flex-wrap:wrap;padding-block:44px 28px}
.top .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.32em;color:var(--brass);font-size:.82rem}
.top h1{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(2.1rem,5.5vw,3.6rem);line-height:1;margin:6px 0 0}
.top p{margin:10px 0 0;color:var(--muted);max-width:52ch}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#1d2026;border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--brass)}
.btn.brass{background:var(--brass);color:#17120a;border-color:var(--brass)}
.btn.brass:hover{background:var(--brass-hi)}
.btn.danger{background:#7a2420;border-color:#7a2420;color:#fff}
.btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi)}
.btn[disabled]{opacity:.5;cursor:progress}

/* shelves */
main{padding-bottom:120px}
.shelves{display:grid;gap:56px}
.shelf{position:relative}
.plaque{display:inline-block;font-family:var(--display);font-weight:600;letter-spacing:.2em;font-size:.85rem;color:#1b140a;background:linear-gradient(#e2c37e,#b48c45);padding:3px 14px;border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 6px rgba(0,0,0,.5);margin-bottom:10px}
.plaque small{font-weight:500;letter-spacing:.08em;opacity:.75;margin-left:8px}
.row{display:flex;align-items:flex-end;gap:3px;padding:28px 16px 0;min-height:280px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;border-inline:14px solid #3a281b;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%),linear-gradient(90deg,rgba(0,0,0,.45),transparent 5%,transparent 95%,rgba(0,0,0,.45)),#0e1012}
.row::-webkit-scrollbar{display:none}
.board{height:22px;margin-inline:-6px;border-radius:2px;background:linear-gradient(180deg,#6a4a31 0,#55392a 30%,var(--wood) 55%,var(--wood-dk) 100%);box-shadow:0 14px 24px -6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.12) inset}
.board::after{content:"";display:block;height:10px;margin-top:22px;background:linear-gradient(rgba(0,0,0,.45),transparent);filter:blur(2px)}

.book{--c:#1b2a4a;position:relative;flex:none;border:0;padding:0;cursor:pointer;border-radius:3px 3px 1px 1px;background:
  linear-gradient(90deg,rgba(0,0,0,.45) 0,rgba(255,255,255,.10) 18%,rgba(255,255,255,.02) 45%,rgba(0,0,0,.18) 80%,rgba(0,0,0,.5) 100%),var(--c);
  box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,2px 0 4px rgba(0,0,0,.35);transform:translateY(0);transition:transform .25s ease,box-shadow .25s ease;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:14px;color:var(--brass-hi)}
.book:hover,.book:focus-visible{transform:translateY(-14px);box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,2px 10px 18px rgba(0,0,0,.55)}
.book .band{width:70%;height:6px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.85}
.book .yr{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:1.25rem;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.book .ttl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,232,216,.65);max-height:42%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.book .mono{font-family:var(--display);font-size:.62rem;letter-spacing:.18em}
.book.add{--c:transparent;background:transparent;border:2px dashed #4a4d55;color:var(--muted);box-shadow:none;justify-content:center;width:56px;height:230px}
.book.add:hover{border-color:var(--brass);color:var(--brass-hi)}
.bookend{flex:none;width:14px;height:150px;margin-left:10px;background:linear-gradient(90deg,#2b2e34,#40444c);border-radius:2px 2px 0 0;box-shadow:2px 0 6px rgba(0,0,0,.5)}
.edit-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--brass);color:#17120a;border-radius:999px;width:22px;height:22px;display:grid;place-items:center;font-size:.7rem;font-weight:700}

.empty{border:1px dashed #3a3d44;border-radius:12px;padding:48px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);color:var(--ivory);font-size:1.4rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}

/* reader */
.reader{position:fixed;inset:0;z-index:50;background:radial-gradient(80% 70% at 50% 45%,#23262c,#0b0c0e);display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.r-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.r-title{flex:1;min-width:0}
.r-title b{display:block;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title span{color:var(--muted);font-size:.85rem}
.ibtn{width:44px;height:44px;border-radius:10px;border:1px solid #33363d;background:#17191d;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ivory)}
.ibtn:hover{border-color:var(--brass)}
.ibtn[disabled]{opacity:.3;cursor:default}
.r-stage{display:flex;align-items:center;justify-content:center;gap:12px;min-height:0;padding-inline:max(8px,env(safe-area-inset-left,0px))}
.r-book-holder{position:relative;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}}
.r-msg{color:var(--muted);text-align:center;padding:24px}
.r-bottom{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));justify-content:center}
.r-bottom input[type=range]{flex:1;max-width:560px;accent-color:var(--brass)}
.ibtn.mob{display:none}
.r-count{font-family:var(--display);letter-spacing:.08em;min-width:7.5em;text-align:center;color:var(--ivory);font-variant-numeric:tabular-nums}

/* pages */
.pg{background:var(--paper);overflow:hidden;position:relative}
.pg img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.pg .num{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.7rem;color:#9b9384;font-family:var(--display);letter-spacing:.1em}
.pg.blank{background:var(--paper)}
.cover{--c:#1b2a4a;background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.12),transparent 55%),linear-gradient(90deg,rgba(0,0,0,.35),transparent 8%),var(--c);color:var(--brass-hi)}
.cover .cv{position:absolute;inset:0;display:flex}
.cover .frame{margin:7%;flex:1;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:-8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6%;padding:8%}
.cover .org{font-family:var(--display);letter-spacing:.34em;font-weight:600;font-size:clamp(.6rem,1.6vh,1rem)}
.cover .big{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,12vh,7rem);line-height:.9;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.cover .rule{width:30%;height:2px;background:currentColor}
.cover .sub{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:clamp(.6rem,1.7vh,1.05rem);color:var(--ivory);max-width:90%}
.cover.back .frame{gap:12px}
.cover.back .org{opacity:.8}

/* zoom */
.zoom{position:fixed;inset:0;z-index:60;background:#0b0c0e;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);padding-top:env(safe-area-inset-top,0px)}
.zoom-body{overflow:auto;overscroll-behavior:contain;padding:16px}
.zoom-body img{display:block;margin:0 auto 16px;max-width:none;background:var(--paper)}

/* manage */
.dlg-wrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.dlg{background:#16181c;border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:12px;width:min(760px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:18px}
.dlg h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;font-size:1.6rem}
.form{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.form label{display:grid;gap:6px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field{background:#0f1114;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--ivory)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--brass-hi);box-shadow:0 0 0 2px #16181c inset}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.th{background:#0f1114;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid}
.th img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--paper)}
.th .bar{display:flex;justify-content:space-between;align-items:center;padding:2px}
.th .bar span{font-size:.75rem;color:var(--muted);font-family:var(--display)}
.th .bar button{background:none;border:0;cursor:pointer;color:var(--ivory);width:28px;height:28px;border-radius:4px}
.th .bar button:hover{background:#2a2d33}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .sp{margin-left:auto}
.msg{font-size:.9rem;color:var(--muted)}
.msg.err{color:#ff8a7a}
.dirty{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1d2026;border-top:2px solid var(--brass);padding-bottom:env(safe-area-inset-bottom,0px)}
.dirty .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.dirty .grow{flex:1;min-width:200px}

@media (max-width:640px){
  .top{padding-block:28px 20px}
  .tools{margin-left:0}
  .row{min-height:250px;padding-inline:10px}
  .form{grid-template-columns:1fr}
  .r-stage .ibtn{display:none}
  .ibtn.mob{display:inline-flex}
  .r-count{min-width:6em;font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){.book,.reader,.r-book-holder{transition:none;animation:none}}
</style>
<div id="app"></div>
<script type="application/json" id="state">{"books":[]}</script>
<script id="main">
(function(){
"use strict";
const HEAD='<title>OCHSWA Championship Shelf</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">\n';
const SKELETON='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
const FLIPJS="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js";
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFWORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const COLORS=["#1b2a4a","#5a1e24","#1f3a2e","#2a2a30","#173c45","#4a3221","#3a2149"];
const DRAFT="ochswa-shelf-draft";
const I={
  x:'<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  l:'<svg class="icon" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>',
  r:'<svg class="icon" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>',
  zoom:'<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg>',
  plus:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  pen:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};

/* state */
const served=document.getElementById("state").textContent;
const parse=s=>{try{const d=JSON.parse(s);if(!Array.isArray(d.books))d.books=[];return d;}catch(e){return {books:[]};}};
let D=parse(served);
const U={canEdit:false,manage:false,dirty:false,restored:false,artifact:null,assets:null};

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blob=id=>"/_blob/"+encodeURIComponent(id);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const books=()=>[...D.books].sort((a,b)=>Number(a.year)-Number(b.year));
const findBook=id=>D.books.find(b=>b.id===id);
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
const colorOf=b=>b.color||COLORS[hash(b.year)%COLORS.length];
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("A viewer component couldn't load. Check your connection and try again."));document.head.appendChild(s);});}
let flipP=null;const loadFlip=()=>flipP||(flipP=loadScript(FLIPJS).then(()=>window.St).catch(e=>{flipP=null;throw e;}));
let pdfP=null;const loadPdf=()=>pdfP||(pdfP=loadScript(PDFJS).then(()=>loadScript(PDFWORKER)).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFWORKER;return window.pdfjsLib;}).catch(e=>{pdfP=null;throw e;}));

/* shell */
$("#app").innerHTML=`<main class="wrap">
  <header class="top"><div><div class="eyebrow">OCHSWA ARCHIVE</div><h1>The Championship Shelf</h1><p>Orange County High School Wrestling Association. One volume per season. Pull a book off the shelf to read it.</p></div>
  <div class="tools" id="tools"></div></header>
  <div class="shelves" id="shelves"></div></main>
  <div id="reader-root"></div><div id="dlg-root"></div><div class="dirty" id="dirty" hidden></div>`;

function renderTools(){
  $("#tools").innerHTML=U.canEdit?`<button class="btn" id="manage" aria-pressed="${U.manage}">${I.pen}<span>${U.manage?"Done managing":"Manage shelf"}</span></button>${U.manage?`<button class="btn brass" data-new>${I.plus}<span>Add a year</span></button>`:""}`:"";
}
function spine(b){
  const n=(b.pages||[]).length,w=Math.max(40,Math.min(78,34+n*0.6)),h=210+(hash(b.id)%5)*9;
  return `<button class="book" data-book="${esc(b.id)}" style="--c:${esc(colorOf(b))};width:${w}px;height:${h}px" aria-label="${esc(b.year)} ${esc(b.title||"")}, ${n} page${n===1?"":"s"}${U.manage?", edit":""}">
    ${U.manage?`<span class="edit-badge" aria-hidden="true">✎</span>`:""}
    <span class="band"></span>${b.title?`<span class="ttl">${esc(b.title)}</span>`:""}<span class="yr">${esc(b.year)}</span><span class="mono">OC</span><span class="band"></span></button>`;
}
function renderShelves(){
  const bs=books(),root=$("#shelves");
  if(!bs.length){root.innerHTML=`<div class="shelf"><div class="row" style="justify-content:center;align-items:center">${U.manage?`<button class="book add" data-new aria-label="Add a year">${I.plus}</button>`:`<div class="empty" style="border:0"><strong>The shelf is empty</strong>Season volumes appear here once they're added${U.canEdit?". Choose Manage shelf to add the first year.":"."}</div>`}</div><div class="board"></div></div>`;return;}
  const g={};bs.forEach(b=>{const d=Math.floor(Number(b.year)/10)*10||"Other";(g[d]=g[d]||[]).push(b);});
  const keys=Object.keys(g).sort((a,b)=>a-b);
  root.innerHTML=keys.map((k,i)=>`<section class="shelf" aria-label="${k}s"><span class="plaque">${k}s<small>${g[k].length} vol.</small></span>
    <div class="row">${g[k].map(spine).join("")}${U.manage&&i===keys.length-1?`<button class="book add" data-new aria-label="Add a year">${I.plus}</button>`:""}<span class="bookend" aria-hidden="true"></span></div><div class="board"></div></section>`).join("");
}
function render(){renderTools();renderShelves();renderDirty();}

/* ---------- reader ---------- */
const Reader=(()=>{
  let pf=null,book=null,total=0,ratio=0.773,rT=null;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function pagesHTML(b){
    const c=esc(colorOf(b)),ps=b.pages||[];
    const out=[`<div class="pg cover" data-density="hard" style="--c:${c}"><div class="cv"><div class="frame"><div class="org">OCHSWA</div><div class="big">${esc(b.year)}</div><div class="rule"></div><div class="sub">${esc(b.title||"Season Record")}</div></div></div></div>`];
    ps.forEach((p,i)=>out.push(`<div class="pg"><img data-i="${i}" src="${blob(p.id)}" alt="${esc(b.year)} page ${i+1}" ${i<6?"":'loading="lazy"'} draggable="false"><span class="num">${i+1}</span></div>`));
    if(!ps.length)out.push(`<div class="pg blank"><div class="r-msg" style="color:#7d7565;padding-top:40%">No pages have been added to this volume yet.</div></div>`);
    if(out.length%2===1)out.push(`<div class="pg blank"></div>`);
    out.push(`<div class="pg cover back" data-density="hard" style="--c:${c}"><div class="cv"><div class="frame"><div class="org">ORANGE COUNTY HIGH SCHOOL</div><div class="org">WRESTLING ASSOCIATION</div><div class="rule"></div><div class="org">${esc(b.year)}</div></div></div></div>`);
    return out;
  }
  function dims(){
    const st=$("#r-stage"),W=st.clientWidth-(window.innerWidth>640?120:16),H=st.clientHeight-16;
    const two=window.innerWidth>=760&&W/2/H>ratio*0.55;
    let h=Math.min(H,two?W/2/ratio:W/ratio);let w=Math.floor(h*ratio);h=Math.floor(h);
    return {w,h,two};
  }
  function wake(i){document.querySelectorAll(`#r-book img[data-i]`).forEach(img=>{const k=Number(img.dataset.i);if(Math.abs(k-(i-1))<=5)img.loading="eager";});}
  function ui(){if(!pf)return;const i=pf.getCurrentPageIndex(),n=pf.getPageCount();
    const ps=(book.pages||[]).length;
    $("#r-count").textContent=i===0?"Cover":i>=n-1?"Back cover":(ps?`Page ${Math.min(i,ps)}${pf.getOrientation()==="landscape"&&i+1<=ps?"–"+(i+1):""} of ${ps}`:"");
    $("#r-slide").max=n-1;$("#r-slide").value=i;
    ["#r-prev","#r-prev2"].forEach(s=>$(s).disabled=i<=0);["#r-next","#r-next2"].forEach(s=>$(s).disabled=i>=n-1);wake(i);}
  async function build(start){
    const St=await loadFlip();if(!book)return;
    const holder=$("#r-holder");if(pf){try{pf.destroy();}catch(e){}pf=null;}
    holder.innerHTML=`<div id="r-book"></div>`;
    const el=$("#r-book");el.innerHTML=pagesHTML(book).join("");
    const {w,h,two}=dims();el.style.width=(two?w*2:w)+"px";el.style.height=h+"px";
    pf=new St.PageFlip(el,{width:w,height:h,size:"fixed",showCover:true,usePortrait:!two,autoSize:false,maxShadowOpacity:.5,flippingTime:reduce?250:900,mobileScrollSupport:false,drawShadow:true,startPage:start||0,disableFlipByClick:false});
    pf.on("flip",ui);pf.on("init",ui);
    pf.loadFromHTML(el.querySelectorAll(".pg"));total=pf.getPageCount();ui();
  }
  async function open(b){
    book=b;
    $("#reader-root").innerHTML=`<div class="reader" role="dialog" aria-modal="true" aria-label="${esc(b.year)} volume">
      <div class="r-top"><button class="ibtn" id="r-close" aria-label="Back to shelf">${I.x}</button><div class="r-title"><b>${esc(b.year)} ${esc(b.title||"Season Record")}</b><span>OCHSWA · ${(b.pages||[]).length} pages</span></div>
        <button class="ibtn" id="r-zoom" aria-label="Zoom into this page" ${(b.pages||[]).length?"":"disabled"}>${I.zoom}</button></div>
      <div class="r-stage" id="r-stage"><button class="ibtn" id="r-prev" aria-label="Previous page">${I.l}</button><div class="r-book-holder" id="r-holder"><div class="r-msg">Opening ${esc(b.year)}…</div></div><button class="ibtn" id="r-next" aria-label="Next page">${I.r}</button></div>
      <div class="r-bottom"><button class="ibtn mob" id="r-prev2" aria-label="Previous page">${I.l}</button><input type="range" id="r-slide" min="0" max="1" value="0" aria-label="Jump to page"><span class="r-count" id="r-count"></span><button class="ibtn mob" id="r-next2" aria-label="Next page">${I.r}</button></div></div>`;
    document.body.style.overflow="hidden";
    $("#r-close").onclick=close;["#r-prev","#r-prev2"].forEach(s=>$(s).onclick=()=>pf&&pf.flipPrev());["#r-next","#r-next2"].forEach(s=>$(s).onclick=()=>pf&&pf.flipNext());
    $("#r-slide").oninput=e=>{if(pf){pf.turnToPage(Number(e.target.value));ui();}};
    $("#r-zoom").onclick=zoom;
    try{const first=(b.pages||[])[0];ratio=first&&first.w&&first.h?Math.min(1.1,Math.max(.55,first.w/first.h)):0.773;await build(0);$("#r-close").focus();}
    catch(e){$("#r-holder").innerHTML=`<div class="r-msg">${esc(e.message||"This volume couldn't be opened.")}</div>`;}
  }
  function close(){if(pf){try{pf.destroy();}catch(e){}}pf=null;const last=book;book=null;$("#reader-root").innerHTML="";document.body.style.overflow="";
    if(last){const s=document.querySelector(`[data-book="${last.id}"]`);if(s)s.focus();}}
  function zoom(){if(!pf||!book)return;const i=pf.getCurrentPageIndex(),ps=book.pages||[];
    const idx=pf.getOrientation()==="landscape"?[i-1,i]:[i-1];const show=idx.filter(k=>k>=0&&k<ps.length);if(!show.length)show.push(0);
    let scale=1;const z=document.createElement("div");z.className="zoom";
    z.innerHTML=`<div class="r-top"><button class="ibtn" data-zc aria-label="Close zoom">${I.x}</button><div class="r-title"><b>${esc(book.year)} · page ${show.map(k=>k+1).join("–")}</b><span>Scroll to move around</span></div><button class="ibtn" data-zo aria-label="Zoom out">−</button><button class="ibtn" data-zi aria-label="Zoom in">+</button></div><div class="zoom-body">${show.map(k=>`<img src="${blob(ps[k].id)}" alt="Page ${k+1}">`).join("")}</div>`;
    document.body.appendChild(z);
    const fit=()=>{const bw=z.querySelector(".zoom-body").clientWidth-32;z.querySelectorAll("img").forEach(im=>im.style.width=Math.round(Math.min(bw,1100)*scale)+"px");};
    fit();z.onclick=e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.zc!==undefined)z.remove();else{scale=Math.max(1,Math.min(4,scale+(t.dataset.zi!==undefined?.5:-.5)));fit();}};
  }
  window.addEventListener("keydown",e=>{if(!book)return;if(document.querySelector(".zoom")){if(e.key==="Escape")document.querySelector(".zoom").remove();return;}
    if(e.key==="ArrowRight")pf&&pf.flipNext();else if(e.key==="ArrowLeft")pf&&pf.flipPrev();else if(e.key==="Escape")close();});
  window.addEventListener("resize",()=>{if(!book||!pf)return;clearTimeout(rT);rT=setTimeout(()=>{const i=pf.getCurrentPageIndex();build(i);},200);});
  return {open,close};
})();

/* ---------- manage ---------- */
let edit=null;
function openEditor(b){
  edit=b?JSON.parse(JSON.stringify(b)):{id:uid(),year:"",title:"",color:"",pages:[],isNew:true};
  drawEditor();
}
function drawEditor(msg,err){
  const b=edit,c=b.color||(b.year?COLORS[hash(b.year)%COLORS.length]:COLORS[0]);
  $("#dlg-root").innerHTML=`<div class="dlg-wrap"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t">${b.isNew?"Add a year":"Edit "+esc(b.year)}</h2>
    <div class="form"><label for="e-year">Season year<input class="field" id="e-year" inputmode="numeric" maxlength="4" value="${esc(b.year)}" placeholder="1998"></label>
      <label for="e-title">Title on cover<input class="field" id="e-title" value="${esc(b.title)}" placeholder="Season Record"></label></div>
    <div style="display:grid;gap:8px"><span class="msg">Cover color</span><div class="swatches">${COLORS.map(x=>`<button class="sw" data-sw="${x}" style="background:${x}" aria-label="Color ${x}" aria-pressed="${x===c}"></button>`).join("")}</div></div>
    <div style="display:grid;gap:10px"><div class="acts"><span class="msg">${b.pages.length} page${b.pages.length===1?"":"s"} · in reading order</span>
      <label class="btn sp" for="e-files" style="cursor:pointer">${I.plus}<span>Add pages</span></label><input id="e-files" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" multiple hidden></div>
      <span class="msg">PDFs are split into pages automatically. Images are added in file-name order.</span>
      ${b.pages.length?`<div class="thumbs">${b.pages.map((p,i)=>`<div class="th"><img src="${blob(p.id)}" alt="Page ${i+1}" loading="lazy"><div class="bar"><button data-mv="${i}" data-d="-1" aria-label="Move page ${i+1} earlier" ${i?"":"disabled"}>‹</button><span>${i+1}</span><button data-mv="${i}" data-d="1" aria-label="Move page ${i+1} later" ${i<b.pages.length-1?"":"disabled"}>›</button><button data-rm="${i}" aria-label="Remove page ${i+1}">✕</button></div></div>`).join("")}</div>`:""}</div>
    <p class="msg ${err?"err":""}" id="e-msg" ${msg?"":"hidden"}>${esc(msg||"")}</p>
    <div class="acts">${b.isNew?"":`<button class="btn danger" data-delbook>Delete this volume</button>`}<span class="sp"></span><button class="btn" data-ecancel>Cancel</button><button class="btn brass" data-esave>${b.isNew?"Put on shelf":"Save"}</button></div>
  </div></div>`;
  const y=$("#e-year");if(y&&!b.year)y.focus();
}
function syncFields(){const y=$("#e-year"),t=$("#e-title");if(y)edit.year=y.value.trim();if(t)edit.title=t.value.trim();}
function emsg(m,err){const e=$("#e-msg");if(!e)return;e.hidden=!m;e.textContent=m||"";e.className="msg"+(err?" err":"");}
async function addFiles(files){
  if(!U.assets){emsg("Adding pages needs Editor access to this page.",true);return;}
  syncFields();files=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const lock=on=>document.querySelectorAll(".dlg button,.dlg input,.dlg label.btn").forEach(x=>{x.disabled=on;x.style.pointerEvents=on?"none":"";});
  lock(true);let added=0;
  try{
    for(const f of files){
      const isPdf=/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name);
      if(isPdf){emsg(`Reading ${f.name}…`);const lib=await loadPdf();const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let p=1;p<=pdf.numPages;p++){emsg(`${f.name}: page ${p} of ${pdf.numPages}…`);
          const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),s=1800/Math.max(vp.width,vp.height),v=pg.getViewport({scale:s});
          const cv=document.createElement("canvas");cv.width=Math.round(v.width);cv.height=Math.round(v.height);
          const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
          await pg.render({canvasContext:ctx,viewport:v}).promise;
          const bl=await new Promise(r=>cv.toBlob(r,"image/jpeg",.86));
          const up=await U.assets.upload(bl,{type:"image/jpeg"});edit.pages.push({id:up.id,w:cv.width,h:cv.height});added++;}
      }else{
        emsg(`Uploading ${f.name}…`);
        const t=f.type||({png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp"})[(f.name.split(".").pop()||"").toLowerCase()];
        const dimsP=new Promise(r=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{r({w:im.naturalWidth,h:im.naturalHeight});URL.revokeObjectURL(u);};im.onerror=()=>{r({w:0,h:0});URL.revokeObjectURL(u);};im.src=u;});
        const up=await U.assets.upload(f,t&&t!==f.type?{type:t}:undefined);const d=await dimsP;edit.pages.push({id:up.id,w:d.w,h:d.h});added++;}
    }
    drawEditor(`Added ${added} page${added===1?"":"s"}.`);
  }catch(e){
    drawEditor((added?`Added ${added} page${added===1?"":"s"}, then stopped. `:"")+({too_large:"A file is over 20 MB. Compress or split it.",unsupported_type:"Use a PDF, PNG, JPEG or WebP file.",quota_or_state:"Storage is full. Remove unused pages first.",rate_limited:"Too many uploads at once. Wait a minute and add the rest."}[e&&e.code]||(e&&e.message)||"Upload failed. Try again."),true);
  }
}
function saveEditor(){
  syncFields();const b=edit;
  if(!/^\d{4}$/.test(b.year)){emsg("Enter a four-digit year, like 1998.",true);return;}
  if(D.books.some(x=>x.year===b.year&&x.id!==b.id)){emsg(`There's already a ${b.year} volume on the shelf. Open it to add pages.`,true);return;}
  const clean={id:b.id,year:b.year,title:b.title,color:b.color,pages:b.pages};
  const i=D.books.findIndex(x=>x.id===b.id);if(i>=0)D.books[i]=clean;else D.books.push(clean);
  edit=null;$("#dlg-root").innerHTML="";markDirty();render();
}

/* publish */
function markDirty(){U.dirty=JSON.stringify(D)!==JSON.stringify(parse(served));try{U.dirty?sessionStorage.setItem(DRAFT,JSON.stringify(D)):sessionStorage.removeItem(DRAFT);}catch(e){}renderDirty();}
function renderDirty(){const el=$("#dirty");el.hidden=!(U.canEdit&&U.dirty);if(el.hidden)return;
  el.innerHTML=`<div class="wrap"><span class="grow">${U.restored?"Unpublished changes restored from this browser.":"Your changes are only visible to you until you publish."}</span><span class="msg" id="pub-msg"></span><button class="btn" data-discard>Discard</button><button class="btn brass" data-publish>Publish shelf</button></div>`;}
function buildHTML(){
  return SKELETON+HEAD+'<style id="css">'+$("#css").textContent+'</style>\n<div id="app"></div>\n<script type="application/json" id="state">'+JSON.stringify(D).replace(/</g,"\\u003c")+'<\/script>\n<script id="main">'+$("#main").textContent+'<\/script>\n</body></html>';
}
async function publish(btn){
  const m=$("#pub-msg");if(!U.artifact){m.textContent="Publishing isn't available in this view.";m.className="msg err";return;}
  btn.disabled=true;btn.textContent="Publishing…";
  try{await U.artifact.publish(buildHTML());}
  catch(e){btn.disabled=false;btn.textContent="Publish shelf";const c=e&&e.code;m.className="msg err";
    m.textContent=c==="conflict"?"Someone else published first. Reloading to their version; your draft is kept in this browser.":c==="not_writer"||c==="not_granted"?"You don't have edit access to publish.":c==="too_large"?"The shelf is too large to publish.":c==="rate_limited"?"Publishing too often. Wait a minute.":"Couldn't publish. Try again.";}
}

/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const ds=t.dataset;
  if(t.id==="manage"){U.manage=!U.manage;render();}
  else if(ds.new!==undefined)openEditor(null);
  else if(ds.book){const b=findBook(ds.book);if(!b)return;U.manage?openEditor(b):Reader.open(b);}
  else if(ds.sw){syncFields();edit.color=ds.sw;document.querySelectorAll(".sw").forEach(s=>s.setAttribute("aria-pressed",s===t));}
  else if(ds.mv!==undefined){syncFields();const i=Number(ds.mv),j=i+Number(ds.d),p=edit.pages;[p[i],p[j]]=[p[j],p[i]];drawEditor();}
  else if(ds.rm!==undefined){syncFields();edit.pages.splice(Number(ds.rm),1);drawEditor("Page removed.");}
  else if(ds.ecancel!==undefined){edit=null;$("#dlg-root").innerHTML="";}
  else if(ds.esave!==undefined)saveEditor();
  else if(ds.delbook!==undefined){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Click again to delete";return;}D.books=D.books.filter(x=>x.id!==edit.id);edit=null;$("#dlg-root").innerHTML="";markDirty();render();}
  else if(ds.publish!==undefined)publish(t);
  else if(ds.discard!==undefined){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Click again to discard";return;}D=parse(served);U.restored=false;markDirty();render();}
});
document.addEventListener("change",e=>{if(e.target.id==="e-files"&&e.target.files.length)addFiles(e.target.files);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&edit&&!document.querySelector(".dlg [disabled]")){edit=null;$("#dlg-root").innerHTML="";}});

/* boot */
render();
loadFlip().catch(()=>{});
(async()=>{
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const user=await use("user");
  U.canEdit=!!(user&&await user.canEdit().catch(()=>false));
  if(!U.canEdit)return;
  [U.artifact,U.assets]=await Promise.all([use("artifact"),use("assets")]);
  try{const d=sessionStorage.getItem(DRAFT);if(d){if(JSON.stringify(parse(d))===JSON.stringify(parse(served)))sessionStorage.removeItem(DRAFT);else{D=parse(d);U.dirty=true;U.restored=true;}}}catch(e){}
  render();
})();
})();
</script>
